<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conversational AI System</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh}
    main{width:min(720px,92vw);height:min(760px,90vh);display:flex;flex-direction:column;border:1px solid #374151;border-radius:16px;overflow:hidden;background:#1f2937}
    header{padding:18px 20px;border-bottom:1px solid #374151} h1{font-size:18px;margin:0} p{margin:5px 0 0;color:#9ca3af;font-size:13px}
    #ops{padding:12px 16px;border-top:1px solid #374151;border-bottom:1px solid #374151;font-size:12px;color:#d1d5db;display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .metric{background:#111827;border:1px solid #374151;border-radius:8px;padding:8px}.metric b{display:block;font-size:15px;color:#fff} .metric span{color:#9ca3af} #chat{flex:1;overflow:auto;padding:20px}.msg{max-width:80%;padding:11px 14px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.user{margin-left:auto;background:#374151}.bot{background:#111827;border:1px solid #374151}
    form{display:flex;gap:8px;padding:12px;border-top:1px solid #374151} input{flex:1;padding:12px;border-radius:9px;border:1px solid #4b5563;background:#111827;color:#fff}button{padding:0 18px;border:0;border-radius:9px;cursor:pointer}
  </style>
</head>
<body>
<main>
  <header><h1>Conversational AI System</h1><p>Structured intake, contextual memory, and voice-enabled dialogue.</p></header>
  <section id="chat" aria-live="polite"></section>
  <aside id="state" aria-label="Session state">Session state: loading…</aside>
  <aside id="evaluation" aria-label="Evaluation status">Evaluation: loading…</aside>
  <aside id="failures" aria-label="Failure observatory">Failures: loading…</aside>
  <section id="ops" aria-label="Operations dashboard">
    <div class="metric"><b id="opRuns">—</b><span>Runs</span></div>
    <div class="metric"><b id="opRate">—</b><span>Run success</span></div>
    <div class="metric"><b id="opLatency">—</b><span>Mean latency</span></div>
    <div class="metric"><b id="opErrors">—</b><span>Stage errors</span></div>
  </section>
  <form id="form"><input id="input" autocomplete="off" placeholder="Type a message…"><button>Send</button></form>
</main>
<script>
const state=document.querySelector("#state");
const session=crypto.randomUUID(),chat=document.querySelector('#chat'),input=document.querySelector('#input');
async function refreshEvaluation(){try{const r=await fetch('/evaluation');const e=await r.json();const d=e.evaluations.dialogue;state.textContent=state.textContent;evaluation.textContent='Evaluation: dialogue '+Math.round(d.metrics.deterministic_case_pass_rate*100)+'% · generation '+e.generation.status;}catch(err){evaluation.textContent='Evaluation unavailable';}}
refreshEvaluation();
async function refreshFailures(){try{const r=await fetch('/failures');const f=await r.json();failures.textContent='Failures: '+f.summary.total_failures+' · open '+(f.summary.by_status.open||0)+' · high '+((f.summary.by_severity.high||0)+(f.summary.by_severity.critical||0));}catch(e){failures.textContent='Failure data unavailable';}}
refreshFailures();
async function refreshOperations(){try{const r=await fetch('/operations');const o=await r.json();opRuns.textContent=o.runs.total_runs;opRate.textContent=o.runs.total_runs?Math.round(o.runs.successful_runs/o.runs.total_runs*100)+'%':'—';opLatency.textContent=o.runs.mean_total_latency_ms!=null?Math.round(o.runs.mean_total_latency_ms)+' ms':'—';opErrors.textContent=o.runs.error_count;}catch(e){opRuns.textContent='—';opRate.textContent='—';opLatency.textContent='—';opErrors.textContent='—';}}
refreshOperations();
async function refreshState(){try{const r=await fetch('/session/'+encodeURIComponent(session)+'/state');const s=await r.json();state.textContent='Session: '+s.status+' · '+Math.round(s.progress.completion_rate*100)+'% complete';}catch(e){state.textContent='Session state unavailable';}}
refreshState();
async function startSession(){
  try{
    const r=await fetch('/session/'+encodeURIComponent(session)+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:'en'})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Session start failed');
    add(data.reply,'bot');
    refreshState();
  }catch(err){add('Unable to start the session. Please try again.','bot');console.error(err);}
}
startSession();
function add(text,role){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';add(message,'user');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,message})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');add(data.reply,'bot');refreshState();if(data.audio){new Audio(data.audio+'?t='+Date.now()).play().catch(()=>{});}}catch(err){add('Request failed. Please try again.','bot');console.error(err);}});
</script>
</body>
</html>
