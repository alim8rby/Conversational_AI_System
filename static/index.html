<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>El Consulto Chat</title>
  <style>
    /* — Full‐screen animated gradient background — */
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #53354a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0%   { background-position:   0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position:   0% 50%; }
    }

    /* — Greeting overlay — */
    #greeting {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      color: #0ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeOut 2s ease 3s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    /* Circular dynamic logo container */
    #logo-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #0ff, transparent 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
      animation: rotate 6s linear infinite;
    }
    #logo-container img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 15px rgba(0,255,255,0.5);
    }
    @keyframes rotate {
      to { transform: rotate(360deg); }
    }
    #greeting h1 {
      font-size: 1.8rem;
      margin: 0;
      text-align: center;
      text-shadow: 0 0 10px #0ff;
    }
    #greeting p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #aaa;
      text-align: center;
    }

    /* — Chat UI container — */
    #chat-ui {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 600px;
      max-height: 100vh;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,255,255,0.2);
      overflow: hidden;
      position: relative;
    }
    #chat-ui.active {
      display: flex;
    }

    /* — Messages area — */
    #chat {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .msg {
      max-width: 80%;
      padding: 0.75rem 1rem;
      margin: 0.4rem 0;
      border-radius: 16px;
      opacity: 0;
      animation: slideIn 0.3s forwards;
      word-break: break-word;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);  opacity: 1; }
    }
    .user {
      align-self: flex-end;
      background: rgba(255,255,255,0.1);
      border: 1px solid #0ff;
      color: #fff;
    }
    .bot {
      align-self: flex-start;
      background: rgba(0,255,255,0.1);
      border: 1px solid #0ff;
      color: #fff;
    }

    /* — Input row (sticky to bottom) — */
    #inputRow {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      padding: 0.5rem;
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
    }
    #record {
      background: transparent;
      border: none;
      color: #0ff;
      font-size: 1.6rem;
      cursor: pointer;
      margin-right: 0.5rem;
      flex-shrink: 0;
    }
    #record.recording {
      color: #f00;
    }
    #input {
      flex: 1;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #0ff;
      background: transparent;
      color: #fff;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    #input:focus {
      border-color: #f0f;
    }
    #send {
      margin-left: 0.5rem;
      padding: 0.6rem 1rem;
      border: 1px solid #0ff;
      background: transparent;
      color: #0ff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s, color 0.3s;
      flex-shrink: 0;
    }
    #send:hover {
      background: #0ff;
      color: #000;
    }

    /* — Mobile tweaks — */
    @media (max-width: 480px) {
      #chat-ui {
        border-radius: 0;
      }
      .msg {
        max-width: 90%;
        font-size: 0.9rem;
      }
      #input {
        font-size: 0.9rem;
      }
      #send, #record {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Greeting overlay -->
  <div id="greeting">
    <div id="logo-container">
      <img src="/static/logo.png" alt="El Consulto Logo" />
    </div>
    <h1>Welcome to El Consulto</h1>
    <p>Your safe space begins now…</p>
  </div>

  <!-- Main chat UI -->
  <div id="chat-ui">
    <div id="chat"></div>
    <div id="inputRow">
      <button id="record">🎤</button>
      <input id="input" placeholder="Type your message…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    // Reveal chat after greeting
    setTimeout(() => {
      document.getElementById('chat-ui').classList.add('active');
    }, 3500);

    const sessionId = crypto.randomUUID();
    const chat      = document.getElementById('chat');
    const input     = document.getElementById('input');
    const sendBtn   = document.getElementById('send');
    const recordBtn = document.getElementById('record');

    function appendMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage(msgText) {
      const msg = msgText !== undefined
        ? msgText
        : input.value.trim();
      if (!msg) return;
      appendMsg(msg, 'user');
      if (msgText === undefined) input.value = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: sessionId, message: msg })
        });
        const { reply, audio } = await res.json();
        appendMsg(reply, 'bot');
        if (audio) {
          const player = new Audio(audio + '?t=' + Date.now());
          player.play();
        }
      } catch (e) {
        appendMsg('Error: ' + e.message, 'bot');
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', () => sendMessage());
    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    // Speech-to-Text
    let recognition, listening = false;
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        recordBtn.classList.add('recording');
      };
      recognition.onend = () => {
        listening = false;
        recordBtn.classList.remove('recording');
      };
      recognition.onresult = e => {
        const transcript = e.results[0][0].transcript;
        sendMessage(transcript);
      };

      recordBtn.addEventListener('click', () => {
        if (!listening) recognition.start();
        else recognition.stop();
      });
    } else {
      recordBtn.style.display = 'none';
    }
  </script>
</body>
</html>
