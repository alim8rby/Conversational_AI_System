<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conversational AI System</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh}
    main{width:min(720px,92vw);height:min(760px,90vh);display:flex;flex-direction:column;border:1px solid #374151;border-radius:16px;overflow:hidden;background:#1f2937}
    header{padding:18px 20px;border-bottom:1px solid #374151} h1{font-size:18px;margin:0} p{margin:5px 0 0;color:#9ca3af;font-size:13px}
    #chat{flex:1;overflow:auto;padding:20px}.msg{max-width:80%;padding:11px 14px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.user{margin-left:auto;background:#374151}.bot{background:#111827;border:1px solid #374151}
    form{display:flex;gap:8px;padding:12px;border-top:1px solid #374151} input{flex:1;padding:12px;border-radius:9px;border:1px solid #4b5563;background:#111827;color:#fff}button{padding:0 18px;border:0;border-radius:9px;cursor:pointer}
  </style>
</head>
<body>
<main>
  <header><h1>Conversational AI System</h1><p>Structured intake, contextual memory, and voice-enabled dialogue.</p></header>
  <section id="chat" aria-live="polite"></section>
  <form id="form"><input id="input" autocomplete="off" placeholder="Type a message…"><button>Send</button></form>
</main>
<script>
const session=crypto.randomUUID(),chat=document.querySelector('#chat'),input=document.querySelector('#input');
function add(text,role){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';add(message,'user');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,message})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');add(data.reply,'bot');if(data.audio){new Audio(data.audio+'?t='+Date.now()).play().catch(()=>{});}}catch(err){add('Request failed. Please try again.','bot');console.error(err);}});
</script>
</body>
</html>
