<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El Consulto Chat</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #chat { max-width: 600px; margin: auto; }
    .msg { padding: .5rem; border-radius: .3rem; margin-bottom: .5rem; }
    .user { background: #f0f0f0; text-align: right; }
    .bot  { background: #d0ebff; text-align: left; }
    #input { width: calc(100% - 100px); padding: .5rem; }
    #send  { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div style="display:flex; max-width:600px; margin:1rem auto;">
    <input id="input" placeholder="Type your message…" />
    <button id="send">Send</button>
  </div>
  <script>
    // Generate a per-page session ID
    const sessionId = crypto.randomUUID();

    const chat  = document.getElementById('chat');
    const input = document.getElementById('input');
    const send  = document.getElementById('send');

    function appendMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      appendMsg(msg, 'user');
      input.value = '';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: sessionId, message: msg })
        });
        const { reply } = await res.json();
        appendMsg(reply, 'bot');
      } catch (e) {
        appendMsg('Error: ' + e.message, 'bot');
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
